name: Build Windows Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'  # CI uses Node 18; local dev supports up to Node 24
        cache: 'npm'

    - name: Install Inno Setup
      run: |
        choco install innosetup -y
        echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell

    - name: Create virtual environment
      run: |
        python -m venv venv
      shell: powershell

    - name: Install Python dependencies
      run: |
        .\venv\Scripts\Activate.ps1
        python -m pip install --upgrade pip setuptools wheel
        pip install -r backend\requirements.txt
        pip install pyinstaller
      shell: powershell

    - name: Install Node.js dependencies
      run: npm ci
      shell: powershell

    - name: Build frontend
      run: npm run build
      shell: powershell

    - name: Build backend with PyInstaller
      run: |
        .\venv\Scripts\Activate.ps1
        pyinstaller build_windows.spec --clean --noconfirm
      shell: powershell

    - name: Build installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
      shell: powershell

    - name: Get version from package.json
      id: get_version
      run: |
        $version = (Get-Content package.json | ConvertFrom-Json).version
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "Version: $version"
      shell: powershell

    - name: Calculate SHA256 checksum
      id: checksum
      run: |
        $hash = Get-FileHash -Path "installer\output\*.exe" -Algorithm SHA256
        $hashValue = $hash.Hash
        echo "SHA256=$hashValue" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "SHA256: $hashValue"
        
        # Create checksum file
        $installerName = Split-Path $hash.Path -Leaf
        "$hashValue  $installerName" | Out-File -FilePath "installer\output\SHA256SUMS.txt" -Encoding utf8
      shell: powershell

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWebUI-Windows-Installer
        path: |
          installer/output/*.exe
          installer/output/SHA256SUMS.txt
        retention-days: 30

    - name: Create or Update Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          installer/output/*.exe
          installer/output/SHA256SUMS.txt
        body: |
          # Open WebUI for Windows Server 2022 - Release ${{ steps.get_version.outputs.VERSION }}
          
          ## Installation
          
          1. Download `OpenWebUI-Setup-${{ steps.get_version.outputs.VERSION }}-Win64.exe`
          2. Run as Administrator
          3. Follow the installation wizard
          4. Access at http://localhost:8080
          
          ## System Requirements
          
          - Windows Server 2022 (Build 20348 or later)
          - 4 GB RAM minimum (8 GB recommended)
          - 10 GB free disk space
          - Administrator privileges
          
          ## What's New
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          
          ## Verification
          
          **SHA256 Checksum:**
          ```
          ${{ steps.checksum.outputs.SHA256 }}
          ```
          
          Verify with PowerShell:
          ```powershell
          Get-FileHash -Path "OpenWebUI-Setup-${{ steps.get_version.outputs.VERSION }}-Win64.exe" -Algorithm SHA256
          ```
          
          ## Documentation
          
          - [Installation Guide](https://github.com/${{ github.repository }}/blob/main/Documentation/windows-installation.md)
          - [Configuration Guide](https://github.com/${{ github.repository }}/blob/main/Documentation/configuration.md)
          - [Troubleshooting](https://github.com/${{ github.repository }}/blob/main/TROUBLESHOOTING.md)
          
          ## Support
          
          - Report issues: https://github.com/${{ github.repository }}/issues
          - Documentation: https://github.com/${{ github.repository }}/tree/main/Documentation
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment on PR with download link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ✅ Windows Installer Built Successfully!\n\n` +
                  `**Version:** ${{ steps.get_version.outputs.VERSION }}\n\n` +
                  `**Download:** [Build Artifacts](${artifactUrl})\n\n` +
                  `**SHA256:** \`${{ steps.checksum.outputs.SHA256 }}\`\n\n` +
                  `The installer is available in the build artifacts. ` +
                  `Download it from the Actions tab to test this PR.`
          })

