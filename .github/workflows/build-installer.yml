name: Build Windows Installer

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (optional, defaults to package.json version)'
        required: false
        type: string

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          Write-Host "Downloading Inno Setup..." -ForegroundColor Yellow
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup.exe"
          
          Write-Host "Installing Inno Setup..." -ForegroundColor Yellow
          Start-Process -FilePath ".\innosetup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait
          
          Write-Host "Verifying Inno Setup installation..." -ForegroundColor Yellow
          $InnoSetupPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $InnoSetupPath) {
            Write-Host "✓ Inno Setup installed successfully" -ForegroundColor Green
          } else {
            Write-Host "✗ Inno Setup installation failed" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: Get version from package.json
        id: get_version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version" -ForegroundColor Cyan
        shell: pwsh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Python virtual environment
        run: |
          Write-Host "Creating virtual environment..." -ForegroundColor Yellow
          python -m venv venv
          
          Write-Host "Activating virtual environment..." -ForegroundColor Yellow
          .\venv\Scripts\Activate.ps1
          
          Write-Host "Upgrading pip..." -ForegroundColor Yellow
          python -m pip install --upgrade pip setuptools wheel
        shell: pwsh

      - name: Install Python dependencies
        run: |
          .\venv\Scripts\Activate.ps1
          pip install -r backend/requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Build executable with PyInstaller
        run: |
          .\venv\Scripts\Activate.ps1
          pyinstaller build_windows.spec --clean --noconfirm
        shell: pwsh

      - name: Create installer
        run: |
          $InnoSetupPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $InnoSetupPath "installer\setup.iss"
        shell: pwsh

      - name: Get installer filename
        id: get_installer
        run: |
          $installerFile = Get-ChildItem -Path "installer\output" -Filter "*.exe" | Select-Object -First 1
          $installerName = $installerFile.Name
          $installerPath = $installerFile.FullName
          echo "INSTALLER_NAME=$installerName" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_PATH=$installerPath" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $installerName" -ForegroundColor Cyan
          Write-Host "Size: $([math]::Round($installerFile.Length/1MB, 2)) MB" -ForegroundColor Cyan
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWebUI-Windows-Installer
          path: installer/output/*.exe
          retention-days: 90
          if-no-files-found: error

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: installer/output/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          Write-Host ""
          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host "Build Complete!" -ForegroundColor Green
          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Installer created successfully:" -ForegroundColor Yellow
          Get-ChildItem -Path "installer\output" -Filter "*.exe" | ForEach-Object {
            Write-Host "  • $($_.Name) ($([math]::Round($_.Length/1MB, 2)) MB)" -ForegroundColor White
          }
          Write-Host ""
          Write-Host "Download artifact from Actions tab or release page" -ForegroundColor Cyan
          Write-Host ""
        shell: pwsh

